# =============================================================================
# application-demo.yml — "demo" profile (environment) for the gated COA/COD runner.
#
# Activate with -Dmicronaut.environments=demo. This profile:
#   1) enables the EXPLICIT flag demo.coa-cod.enabled=true -> instantiates the CoaCodDemoRunner
#      (ApplicationEventListener<StartupEvent>), which runs the produce -> consume -> COA/COD flow
#      ONCE on startup and prints the PASS/FAIL summary;
#   2) connects as ADMIN via DEV.ADMIN.SVRCONN.
#
# Why admin / DEV.ADMIN.SVRCONN (gotcha 2035)? For the Queue Manager to GENERATE and DELIVER a
# COA/COD report it performs a PUT-with-context onto the ReplyToQ, requiring context authority
# (+setall). The low-privilege 'app' user of the dev image does NOT have this -> the report PUT
# fails with MQRC_NOT_AUTHORIZED (2035), the report goes to the DLQ and the report queue stays empty
# (the demo would never see COA/COD). The 'admin' user has full authority. In PRODUCTION, grant the
# minimum required authority to the app principal (SET AUTHREC ... AUTHADD(PUT, SETALL)) instead of
# using admin.
#
# The password comes from MQ_ADMIN_PASSWORD (aligned with docker-compose.yml: MQ_ADMIN_PASSWORD=passw0rd)
# with fallback to passw0rd.
# =============================================================================

# EXPLICIT flag that activates the gated runner. Absent outside this profile -> normal startup unaffected.
demo:
  coa-cod:
    enabled: true

ibm-mq:
  # ADMIN channel/user to have the context authority required to generate COA/COD reports.
  channel: DEV.ADMIN.SVRCONN
  user: admin
  password: ${MQ_ADMIN_PASSWORD:passw0rd}
