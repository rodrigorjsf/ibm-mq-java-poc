# =============================================================================
# Report-consumer Deployment — COMPETING CONSUMERS over the report queue (HARNESS_ROLE=report-consumer).
#
# Scaled to N replicas (default 2). All replicas drain the SAME report queue (DEV.QUEUE.2),
# classify COA/COD via JMS_IBM_Feedback, and reconcile against the SHARED JdbcCorrelationStore
# (Postgres). Because the store is cluster-wide and its mutations are idempotent, a COA seen by one
# pod and a COD seen by another converge to one pending_message row (AC2). See the ordering note in
# JdbcCorrelationStore and the README sweep query.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-consumer
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: report-consumer
    app.kubernetes.io/component: harness
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: report-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-consumer
        app.kubernetes.io/component: harness
    spec:
      containers:
        - name: app
          image: ibmmq-jms-harness:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HARNESS_ROLE
              value: "report-consumer"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f com.example.ibmmq.Application > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
