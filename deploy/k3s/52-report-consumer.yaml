# =============================================================================
# Report-consumer Deployment — COMPETING CONSUMERS over the report queue (HARNESS_ROLE=report-consumer).
#
# Scaled to N replicas (default 2). All replicas drain the SAME report queue (DEV.QUEUE.2),
# classify COA/COD via JMS_IBM_Feedback, and reconcile against the SHARED JdbcCorrelationStore
# (Postgres). Because the store is cluster-wide and its mutations are idempotent, a COA seen by one
# pod and a COD seen by another converge to one pending_message row (AC2). See the ordering note in
# JdbcCorrelationStore and the README sweep query.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-consumer
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: report-consumer
    app.kubernetes.io/component: harness
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: report-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-consumer
        app.kubernetes.io/component: harness
    spec:
      initContainers:
        # Block first bring-up until IBM MQ's listener (1414) and Postgres (5432) accept TCP, instead of
        # relying solely on the app's reconnect loop + the store's schema-init retry. Keeps logs clean.
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z ibmmq 1414; do echo 'waiting ibmmq:1414'; sleep 2; done; until nc -z postgres 5432; do echo 'waiting postgres:5432'; sleep 2; done; echo 'deps ready'"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: app
          image: ibmmq-jms-harness:1.0.0
          imagePullPolicy: IfNotPresent
          # Hardening: non-root (UID 1000 pinned in Dockerfile), no privilege escalation, all caps
          # dropped, default seccomp. readOnlyRootFilesystem intentionally unset (MQ client may write
          # FFST/trace under the workdir).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HARNESS_ROLE
              value: "report-consumer"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f com.example.ibmmq.Application > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
