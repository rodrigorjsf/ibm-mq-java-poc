# =============================================================================
# Publisher Deployment — drives BusinessMessageProducer.send in a loop (HARNESS_ROLE=publisher).
#
# Usually 1 replica is enough to feed the business queue; scale up for more load. The same image is
# used by all three roles — only HARNESS_ROLE differs.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: publisher
    app.kubernetes.io/component: harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: publisher
        app.kubernetes.io/component: harness
    spec:
      containers:
        - name: app
          # No registry: image is built locally and imported into k3s (k3s ctr images import).
          image: ibmmq-jms-harness:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HARNESS_ROLE
              value: "publisher"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          # No HTTP server -> exec probe checks the harness worker thread is alive (JVM running).
          # `pgrep -f Application` succeeds while the non-daemon worker keeps the JVM up.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f com.example.ibmmq.Application > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
