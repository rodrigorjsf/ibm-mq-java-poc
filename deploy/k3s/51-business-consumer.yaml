# =============================================================================
# Business-consumer Deployment — COMPETING CONSUMERS (HARNESS_ROLE=business-consumer).
#
# Scaled to N replicas (kustomization parameterizes this; default 3). All replicas do a destructive
# GET on the SAME business queue (DEV.QUEUE.1); IBM MQ hands each message to exactly one consumer,
# realizing the competing-consumer pattern across pods. Each successful commit releases a COD report.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-consumer
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: business-consumer
    app.kubernetes.io/component: harness
spec:
  # Competing consumers: parallelism = replicas (per-pod loop is single-threaded by design).
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: business-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-consumer
        app.kubernetes.io/component: harness
    spec:
      initContainers:
        # Block first bring-up until IBM MQ's listener (1414) and Postgres (5432) accept TCP, instead of
        # relying solely on the app's reconnect loop + the store's schema-init retry. Keeps logs clean.
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z ibmmq 1414; do echo 'waiting ibmmq:1414'; sleep 2; done; until nc -z postgres 5432; do echo 'waiting postgres:5432'; sleep 2; done; echo 'deps ready'"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: app
          image: ibmmq-jms-harness:1.0.0
          imagePullPolicy: IfNotPresent
          # Hardening: non-root (UID 1000 pinned in Dockerfile), no privilege escalation, all caps
          # dropped, default seccomp. readOnlyRootFilesystem intentionally unset (MQ client may write
          # FFST/trace under the workdir).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HARNESS_ROLE
              value: "business-consumer"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f com.example.ibmmq.Application > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
