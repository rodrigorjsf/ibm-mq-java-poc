# =============================================================================
# Business-consumer Deployment — COMPETING CONSUMERS (HARNESS_ROLE=business-consumer).
#
# Scaled to N replicas (kustomization parameterizes this; default 3). All replicas do a destructive
# GET on the SAME business queue (DEV.QUEUE.1); IBM MQ hands each message to exactly one consumer,
# realizing the competing-consumer pattern across pods. Each successful commit releases a COD report.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-consumer
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: business-consumer
    app.kubernetes.io/component: harness
spec:
  # Competing consumers: parallelism = replicas (per-pod loop is single-threaded by design).
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: business-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-consumer
        app.kubernetes.io/component: harness
    spec:
      containers:
        - name: app
          image: ibmmq-jms-harness:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HARNESS_ROLE
              value: "business-consumer"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-credentials
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f com.example.ibmmq.Application > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
