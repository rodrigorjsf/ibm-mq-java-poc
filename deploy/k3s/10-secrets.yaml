# =============================================================================
# Secrets — credentials kept OUT of images and ConfigMaps.
#
# IMPORTANT (advisor trap #5): the MQ container's `app` user password and the Java client's
# IBM_MQ_PASSWORD must carry the SAME value, or every JMS connection fails MQRC_NOT_AUTHORIZED (2035).
# Both are sourced from `mq-app-password` below — change it in ONE place.
#
# The dev MQ image reads the app/admin passwords from files mounted at /run/secrets (MQ_APP_PASSWORD
# is deprecated since 9.4.0). We mount `mq-credentials` there in the StatefulSet.
#
# These are DEV placeholders. For anything beyond a local laptop, replace with a sealed-secret /
# external-secrets operator and never commit real values.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mq-credentials
  namespace: ibmmq-harness
type: Opaque
stringData:
  # Files mounted into the MQ container at /run/secrets/mqAppPassword and /run/secrets/mqAdminPassword.
  mqAppPassword: "passw0rd"
  mqAdminPassword: "passw0rd"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: ibmmq-harness
type: Opaque
stringData:
  # Consumed by the Java app as IBM_MQ_PASSWORD — MUST equal mqAppPassword above.
  IBM_MQ_PASSWORD: "passw0rd"
  # Consumed by the Java app's JDBC datasource (datasources.default.password — WRITER/primary). MUST
  # equal the POSTGRES_PASSWORD in db-credentials below.
  DATASOURCES_DEFAULT_PASSWORD: "corrpass"
  # Consumed by the Java app's READER datasource (datasources.reader.password — replica). The streaming
  # standby authenticates the SAME application user/password as the primary (physical replication
  # copies the role catalog), so this equals DATASOURCES_DEFAULT_PASSWORD / POSTGRES_PASSWORD.
  DATASOURCES_READER_PASSWORD: "corrpass"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ibmmq-harness
type: Opaque
stringData:
  # Postgres credentials: consumed by BOTH the Postgres StatefulSet (POSTGRES_PASSWORD) and the Java
  # app's JDBC datasource (DATASOURCES_DEFAULT_PASSWORD). Keep both in sync (single source here).
  POSTGRES_USER: "corr"
  POSTGRES_PASSWORD: "corrpass"
  POSTGRES_DB: "correlation"
