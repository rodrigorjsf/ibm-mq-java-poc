# =============================================================================
# ConfigMap: non-secret connection settings for the Java app, mapped to MqProperties + harness +
# datasource via Micronaut's env-var binding (UPPER_SNAKE env -> kebab config key).
#
#   IBM_MQ_CONNECTION_NAME_LIST -> ibm-mq.connection-name-list  (MQ Service in-cluster DNS)
#   IBM_MQ_CHANNEL              -> ibm-mq.channel
#   IBM_MQ_QUEUE_MANAGER        -> ibm-mq.queue-manager
#   IBM_MQ_USER                 -> ibm-mq.user
#   IBM_MQ_BUSINESS_QUEUE       -> ibm-mq.business-queue
#   IBM_MQ_REPORT_QUEUE         -> ibm-mq.report-queue
#   CORRELATION_STORE           -> correlation.store         (=jdbc activates JdbcCorrelationStore)
#   DATASOURCES_DEFAULT_*       -> datasources.default.*      (HikariCP / Postgres — WRITER/primary)
#   DATASOURCES_READER_*        -> datasources.reader.*       (HikariCP / Postgres — READER/replica)
#
# Credentials (IBM_MQ_PASSWORD, DATASOURCES_DEFAULT_PASSWORD, DATASOURCES_READER_PASSWORD) come from
# Secrets, NOT here.
# HARNESS_ROLE is set per-Deployment (publisher / business-consumer / report-consumer), not here.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ibmmq-harness
data:
  # CONNAME list points at the MQ Service DNS; (1414) is the listener port. Format: host(port).
  IBM_MQ_CONNECTION_NAME_LIST: "ibmmq.ibmmq-harness.svc.cluster.local(1414)"
  IBM_MQ_CHANNEL: "DEV.APP.SVRCONN"
  IBM_MQ_QUEUE_MANAGER: "QM1"
  IBM_MQ_USER: "app"
  IBM_MQ_BUSINESS_QUEUE: "DEV.QUEUE.1"
  IBM_MQ_REPORT_QUEUE: "DEV.QUEUE.2"
  IBM_MQ_APPLICATION_NAME: "ibmmq-harness"

  # Activate the shared JDBC correlation store (else InMemoryCorrelationStore loads — per-pod, useless
  # cluster-wide). The JDBC datasource: HikariCP via micronaut-jdbc-hikari, Postgres Service DNS.
  #
  # READ/WRITE SPLIT (issue #40, ADR-0005). Two datasources:
  #   * default = WRITER/primary  -> postgres (rw)        : JdbcCorrelationStore (exactly-once
  #       reconciliation, bare DataSource injection resolves to `default`) + the delivery_report
  #       audit INSERTs. Naming the writer `default` is load-bearing — see ADR-0005 / the fact sheet.
  #   * reader  = READER/replica  -> postgres-replica (ro): the delivery_report audit READ-MODEL only.
  #       Never used for a read that gates a write/dedup decision (replica lag). Query/projection only.
  CORRELATION_STORE: "jdbc"
  DATASOURCES_DEFAULT_URL: "jdbc:postgresql://postgres.ibmmq-harness.svc.cluster.local:5432/correlation"
  DATASOURCES_DEFAULT_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  DATASOURCES_DEFAULT_USERNAME: "corr"
  # Single-instance harness stopgap (#21): the reader points at the SAME `postgres` as the writer. A real
  # streaming-replicated `postgres-replica` StatefulSet is a SEPARATE follow-up (deploy/k3s/README.md +
  # docs/runbook.md §2.5). The #21 load path never exercises the read-model (register/audit go to the
  # writer; load-verify reads via psql directly), so a degenerate CQRS reader is sufficient here — replica
  # lag is simply absent. Pointing it at a non-existent `postgres-replica` host fails the reader HikariCP
  # pool init (UnknownHostException) and the apps never create the schema, so this MUST resolve to a real
  # host until the replica StatefulSet lands.
  DATASOURCES_READER_URL: "jdbc:postgresql://postgres.ibmmq-harness.svc.cluster.local:5432/correlation"
  DATASOURCES_READER_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  DATASOURCES_READER_USERNAME: "corr"

  # ---------------------------------------------------------------------------------------------------
  # HikariCP pool sizing — per-pod x replica math against the standby's max_connections (AC6).
  #
  #   default (writer) pool:  4 connections / pod
  #   reader  (replica) pool: 2 connections / pod   (reads are lighter; query/projection only)
  #
  # report-consumer runs at replicas: 2 (see 52-report-consumer.yaml). Worst-case connection demand:
  #   PRIMARY  (writer)  = 4 (default) x 2 pods = 8 connections
  #   REPLICA  (reader)  = 2 (reader)  x 2 pods = 4 connections    PLUS the WRITER pools of any other
  #     role that opens the `default` datasource (publisher + business-consumer register/reconcile on
  #     the writer; they do NOT open the reader pool). The standby's max_connections (Postgres default
  #     100, and the bitnami replica here) comfortably covers 8 writer + 4 reader = 12 concurrent.
  #
  # If you scale report-consumer replicas, recompute: writer = 4 x R, reader = 2 x R, and keep
  #   (writer + reader connections, summed across ALL roles) < primary.max_connections (and the standby's).
  # Competing-consumer parallelism comes from REPLICAS, not threads, so pools stay small per pod.
  # ---------------------------------------------------------------------------------------------------
  DATASOURCES_DEFAULT_MAXIMUM_POOL_SIZE: "4"
  DATASOURCES_READER_MAXIMUM_POOL_SIZE: "2"
