# =============================================================================
# Postgres — the SHARED correlation store backing JdbcCorrelationStore (AC2).
#
# A single-replica StatefulSet with a PVC: every consumer/report pod connects here, so a COA seen by
# one report-consumer pod and a COD seen by another reconcile against the SAME `pending_message` table.
# Single replica is intentional — the harness needs ONE authoritative store, not a Postgres cluster.
#
# The schema (table pending_message) is created lazily by JdbcCorrelationStore#ensureSchema() on app
# startup (CREATE TABLE IF NOT EXISTS — safe under N concurrent replicas), so no init SQL is needed here.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: postgres
spec:
  # Headless service: stable DNS postgres.ibmmq-harness.svc.cluster.local for the StatefulSet pod.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ibmmq-harness
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            # PGDATA in a subdir so the PVC mount root (with lost+found) is not used directly.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # k3s default StorageClass is local-path; leaving storageClassName unset uses the default.
        resources:
          requests:
            storage: 1Gi
